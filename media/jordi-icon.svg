<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="20" y="30" width="88" height="70" rx="20" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Antenna -->
  <line x1="64" y1="30" x2="64" y2="15" stroke="#2E5C8A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="12" r="4" fill="#FF6B6B"/>
  
  <!-- Glasses Frame -->
  <rect x="25" y="45" width="25" height="18" rx="9" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="78" y="45" width="25" height="18" rx="9" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="50" y1="54" x2="78" y2="54" stroke="#1A1A1A" stroke-width="3"/>
  
  <!-- Glasses Lenses -->
  <rect x="27" y="47" width="21" height="14" rx="7" fill="#E8F4FD" opacity="0.8"/>
  <rect x="80" y="47" width="21" height="14" rx="7" fill="#E8F4FD" opacity="0.8"/>
  
  <!-- Eyes behind glasses -->
  <circle cx="37.5" cy="54" r="6" fill="#2E5C8A"/>
  <circle cx="90.5" cy="54" r="6" fill="#2E5C8A"/>
  <circle cx="37.5" cy="54" r="3" fill="#FFFFFF"/>
  <circle cx="90.5" cy="54" r="3" fill="#FFFFFF"/>
  
  <!-- Nose/Sensor -->
  <rect x="60" y="65" width="8" height="4" rx="2" fill="#2E5C8A"/>
  
  <!-- Mouth -->
  <rect x="50" y="75" width="28" height="8" rx="4" fill="#2E5C8A"/>
  <rect x="52" y="77" width="6" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="60" y="77" width="6" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="68" y="77" width="6" height="4" rx="2" fill="#FFFFFF"/>
  
  <!-- Body -->
  <rect x="35" y="100" width="58" height="20" rx="10" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Arms -->
  <rect x="10" y="105" width="25" height="8" rx="4" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  <rect x="93" y="105" width="25" height="8" rx="4" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Hands -->
  <circle cx="12" cy="109" r="6" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  <circle cx="116" cy="109" r="6" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Code Symbol on Chest -->
  <text x="64" y="115" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  
  <!-- Reflection on glasses -->
  <rect x="29" y="49" width="8" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
  <rect x="82" y="49" width="8" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
</svg>